schema_version: 1.0.0
profile: https://arpa.example/profiles/a2a/1.0
source:
  protocol: A2A
  protocol_family: '1.0'
claim_defaults:
  card_content: self_declared
mappings:
- source_path: $.name
  target_record: agent-core
  target_path: $.display_name
  claim_class: self_declared
- source_path: $.description
  target_record: agent-description-reference
  target_path: $.description
  claim_class: self_declared
- source_path: $.interfaces[*]
  target_record: service-endpoint
  preserve:
  - url
  - protocolBinding
  - protocolVersion
- source_path: $.skills[*]
  target_record: capability-declaration
  claim_class: self_declared
  non_implications:
  - capability_verification
  - capability_authorization
  - delegated_authority
  - assurance
  - operational_availability
- source_path: $.securitySchemes
  target_record: service-endpoint
  target_path: $.authentication_requirements
  non_implications:
  - authority
  - delegation
  - principal_consent
- source_path: $.signatures[*]
  target_record: key-binding
  target_path: $.evidence
  non_implications:
  - issuer_competence
  - governance_recognition
  - assurance
- source_path: $.extensions[*]
  target_record: extension-processing-decision
- source_path: A2A.taskId
  target_record: execution-receipt
  target_path: $.a2a.task_id
- source_path: A2A.contextId
  target_record: execution-receipt
  target_path: $.a2a.context_id
precedence:
  authoritative_arpa_state_over_card: true
  cached_card_over_revocation: false
safe_failure:
  unsupported_required_extension: reject
  authority_indeterminate: reject_consequential_action
  digest_mismatch: reject
registry_publication:
  projection_schema: schemas/a2a-publication-projection.schema.json
  portable_card_mutation: false
  exact_source_uri_required: true
  authority_implication: false
  visibility: caller_policy_filtered
  operations:
  - list
  - resolve
  - snapshot
card_compatibility:
  profile: arpa-a2a-card-compatibility-1.0
  compatible_additions:
  - skills
  - interfaces
  - securitySchemes
  - inputModes
  - outputModes
  - capabilities
  breaking_removals:
  - skills
  - interfaces
  - securitySchemes
  - inputModes
  - outputModes
  breaking_changes:
  - disable_existing_capability
  unknown_change: indeterminate
actor_chain_extension:
  status: informative-proposal-tracking
  upstream_reference: a2aproject/A2A#2028
  reviewed_on: '2026-08-20'
  authority_implication: false
  well_formedness_does_not_imply_authority: true
  append_only_required_when_processed: true
  identity_key: issuer-and-subject
  evidence_reference:
    resolution: independent
    missing: unknown-not-denial
    unresolvable: distinct-from-denial
    invalid: distinct-from-unresolvable
    context_binding_required: true
  outcomes:
  - well-formed
  - malformed
  - evidence-missing
  - evidence-unresolvable
  - evidence-invalid
  - authority-revoked
  - authority-expired
  - authority-denied
  - authority-permit
anab_description_extension:
  status: experimental-assurance-input
  extension_uri: https://trustoverip.github.io/dtgwg-agent-names-tf/extensions/anab-description/v1
  baseline: ANAB v0.10.0
  result_schema: schemas/a2a-anab-assurance-result.schema.json
  name_consistency_required: true
  declaration_digest_required_for_verified_claim: true
  card_binding_required_for_verified_claim: true
  freshness_and_revocation_evaluated_separately: true
  authority_implication: false
  consequential_action_requires_separate_delegation: true
