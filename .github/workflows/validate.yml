name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validation dependencies
        run: python -m pip install -r scripts/requirements.txt
      - name: Run Python release validation
        run: make release-check
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run independent TypeScript implementation checks
        run: make typescript-check
      - name: Compare Python and TypeScript conformance outcomes
        run: make cross-runtime
      - name: Run Python-TypeScript network interoperability
        run: make network-interop
      - name: Upload interoperability evidence
        uses: actions/upload-artifact@v7
        with:
          name: arpa-v0.9.0-evidence
          path: |
            artifacts/interoperability/
            conformance/reports/reference-implementation-report.json
            artifacts/typescript/
  pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r scripts/requirements.txt
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          cache-version: 2
      - name: Install IETF authoring dependencies
        run: make ietf-setup
      - name: Build and validate complete GitHub Pages site
        run: make pages-check
      - name: Upload publication evidence
        uses: actions/upload-artifact@v7
        with:
          name: github-pages-assurance
          path: artifacts/pages/
